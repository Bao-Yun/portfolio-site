backend:
  name: github
  repo: Bao-Yun/portfolio-site
  branch: main
  base_url: https://portfolio-oauth.baoyun612132.workers.dev
  auth_endpoint: auth

# 存放編輯內容的資料夾（正式站的 HTML/JS 會讀取這裡的檔案來渲染畫面）
media_folder: "static/images/uploads"
public_folder: "static/images/uploads"

collections:

  # ────────────────────────────────
  # 1. 網站設定（色彩主題、首頁、關於我、頁尾）
  # ────────────────────────────────
  - name: "settings"
    label: "網站設定"
    files:

      - name: "theme"
        label: "🎨 色彩主題"
        file: "data/theme.json"
        fields:
          - { label: "主色（近黑，標題/文字）", name: "ink", widget: "color" }
          - { label: "背景色（主要）", name: "paper", widget: "color" }
          - { label: "背景色（區塊交替用）", name: "paperAlt", widget: "color" }
          - { label: "腔調色 1（如莫蘭迪綠）", name: "sage", widget: "color" }
          - { label: "腔調色 1 深版（hover/文字用）", name: "sageDeep", widget: "color" }
          - { label: "腔調色 2（如霧粉）", name: "rose", widget: "color" }
          - { label: "腔調色 2 深版", name: "roseDeep", widget: "color" }
          - { label: "邊線/分隔線顏色", name: "stone", widget: "color" }
          - { label: "輔助文字顏色（說明文字）", name: "muted", widget: "color" }

      - name: "hero"
        label: "🏠 首頁主視覺"
        file: "data/hero.json"
        fields:
          - { label: "小標籤（Eyebrow）", name: "eyebrow", widget: "string" }
          - label: "主標題（依序排列的文字段落，可自由控制斷行、Highlight 位置、字體大小/顏色/字型）"
            name: "titleSegments"
            widget: "list"
            fields:
              - { label: "文字內容", name: "text", widget: "string" }
              - { label: "套用 Highlight 底色", name: "highlight", widget: "boolean", default: false }
              - { label: "這段之後換行", name: "lineBreakAfter", widget: "boolean", default: false }
              - { label: "文字顏色（選填，覆蓋預設）", name: "color", widget: "color", required: false }
              - label: "字體大小（選填）"
                name: "fontSize"
                widget: "select"
                required: false
                options:
                  - { label: "預設", value: "" }
                  - { label: "小", value: "small" }
                  - { label: "中", value: "medium" }
                  - { label: "大", value: "large" }
                  - { label: "特大", value: "xlarge" }
              - label: "字型（選填）"
                name: "fontFamily"
                widget: "select"
                required: false
                options:
                  - { label: "預設", value: "" }
                  - { label: "標題襯線體", value: "display" }
                  - { label: "內文黑體", value: "body" }
                  - { label: "等寬數字體", value: "mono" }
          - { label: "副標說明（按 Enter 可自由換行）", name: "subtitle", widget: "text" }
          - label: "數據列（右側 3 項數字）"
            name: "stats"
            widget: "list"
            fields:
              - { label: "數字", name: "number", widget: "string" }
              - { label: "說明文字", name: "label", widget: "string" }

      - name: "about"
        label: "🙋 關於我"
        file: "data/about.json"
        fields:
          - label: "個人照片"
            name: "portrait"
            widget: "object"
            required: false
            fields:
              - { label: "圖片", name: "src", widget: "image", required: false }
              - { label: "水平位置（0=最左，50=置中，100=最右）", name: "x", widget: "number", value_type: "int", default: 50, min: 0, max: 100, required: false }
              - { label: "垂直位置（0=最上，50=置中，100=最下）", name: "y", widget: "number", value_type: "int", default: 50, min: 0, max: 100, required: false }
              - { label: "縮放（100=鋪滿框框，數字越大越放大）", name: "zoom", widget: "number", value_type: "int", default: 100, min: 100, max: 200, required: false }
          - { label: "引言 / 一句話理念（按 Enter 可自由換行）", name: "quote", widget: "text" }
          - label: "自我介紹段落"
            name: "paragraphs"
            widget: "list"
            field: { label: "段落內容（按 Enter 可自由換行）", name: "text", widget: "text" }
          - label: "核心技能"
            name: "tags"
            widget: "list"
            field: { label: "技能文字", name: "tag", widget: "string" }

      - name: "resume"
        label: "🎓 學歷與經歷"
        file: "data/resume.json"
        fields:
          - label: "學歷"
            name: "education"
            widget: "list"
            fields:
              - { label: "學校", name: "school", widget: "string" }
              - { label: "科系 / 學位", name: "degree", widget: "string" }
              - { label: "期間（如：2018 - 2022）", name: "period", widget: "string" }
              - { label: "補充說明", name: "description", widget: "text", required: false }
          - label: "工作經歷"
            name: "experience"
            widget: "list"
            fields:
              - { label: "公司 / 單位", name: "company", widget: "string" }
              - { label: "職稱", name: "role", widget: "string" }
              - { label: "期間（如：2023 - 至今）", name: "period", widget: "string" }
              - label: "工作內容 / 成果（條列）"
                name: "highlights"
                widget: "list"
                field: { label: "內容", name: "text", widget: "string" }

      - name: "footer"
        label: "📮 頁尾 / 聯絡方式"
        file: "data/footer.json"
        fields:
          - { label: "小標籤", name: "eyebrow", widget: "string" }
          - label: "邀約聯絡標題（依序排列的文字段落，可自由控制斷行、字體大小/顏色/字型）"
            name: "titleSegments"
            widget: "list"
            fields:
              - { label: "文字內容", name: "text", widget: "string" }
              - { label: "套用 Highlight 底色", name: "highlight", widget: "boolean", default: false }
              - { label: "這段之後換行", name: "lineBreakAfter", widget: "boolean", default: false }
              - { label: "文字顏色（選填，覆蓋預設）", name: "color", widget: "color", required: false }
              - label: "字體大小（選填）"
                name: "fontSize"
                widget: "select"
                required: false
                options:
                  - { label: "預設", value: "" }
                  - { label: "小", value: "small" }
                  - { label: "中", value: "medium" }
                  - { label: "大", value: "large" }
                  - { label: "特大", value: "xlarge" }
              - label: "字型（選填）"
                name: "fontFamily"
                widget: "select"
                required: false
                options:
                  - { label: "預設", value: "" }
                  - { label: "標題襯線體", value: "display" }
                  - { label: "內文黑體", value: "body" }
                  - { label: "等寬數字體", value: "mono" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "電話（選填）", name: "phone", widget: "string", required: false }
          - label: "社群連結"
            name: "socialLinks"
            widget: "list"
            fields:
              - { label: "平台名稱", name: "label", widget: "string" }
              - { label: "連結網址", name: "url", widget: "string" }

      - name: "featured"
        label: "⭐ 精選作品（首頁預設顯示，最多 3 篇）"
        file: "data/featured.json"
        fields:
          - label: "精選作品（最多 3 篇）"
            name: "works"
            widget: "list"
            max: 3
            summary: "{{fields.work}}"
            hint: "最多只能選 3 篇，會依照這裡排列的順序顯示在首頁。超過 3 篇會在儲存/發布時擋下來並顯示提示，請刪減到 3 篇以內。清空的話首頁會自動退回顯示最新的 3 篇作品。"
            field:
              widget: "relation"
              name: "work"
              collection: "works"
              search_fields: ["title"]
              display_fields: ["title"]
              value_field: "{{slug}}"
              options_length: 200

  # ────────────────────────────────
  # 1.5 品牌／公司（讓作品可以歸類到你任職過的公司）
  # ────────────────────────────────
  - name: "brands"
    label: "🏢 品牌／公司"
    folder: "data/brands"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { label: "品牌／公司名稱", name: "name", widget: "string" }
      - { label: "排序（決定「更多作品」裡公司按鈕的先後順序，數字越小越前面）", name: "order", widget: "number", default: 0 }

  # ────────────────────────────────
  # 2. 作品集（不限 IG 圖文，可自由選擇作品類型）
  # ────────────────────────────────
  - name: "works"
    label: "🖼️ 作品集"
    folder: "data/works"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "作品標題", name: "title", widget: "string" }
      - label: "分類"
        name: "category"
        widget: "select"
        default: "其他"
        options: ["美妝", "餐飲", "3C", "生活風格", "服飾", "其他"]
      - label: "所屬品牌／公司（選填，用來在「更多作品」依公司分類瀏覽）"
        name: "brand"
        widget: "relation"
        collection: "brands"
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "name"
        options_length: 200
        required: false
      - label: "作品類型"
        name: "type"
        widget: "select"
        default: "instagram"
        hint: "決定這個作品要怎麼呈現：IG 貼文嵌入 / Facebook 貼文或短影音嵌入 / 上傳圖片 / 影片連結 / PDF 檔案 / 外部連結"
        options:
          - { label: "Instagram 貼文嵌入", value: "instagram" }
          - { label: "Facebook 貼文/短影音嵌入", value: "facebook" }
          - { label: "上傳圖片", value: "image" }
          - { label: "影片連結（YouTube/Vimeo 等）", value: "video" }
          - { label: "PDF 檔案", value: "pdf" }
          - { label: "外部連結", value: "link" }
      - label: "封面縮圖（選填；有填的話會優先顯示這張圖，而不是自動嵌入）"
        name: "coverImage"
        widget: "object"
        required: false
        fields:
          - { label: "圖片", name: "src", widget: "image", required: false }
          - { label: "水平位置（0=最左，50=置中，100=最右）", name: "x", widget: "number", value_type: "int", default: 50, min: 0, max: 100, required: false }
          - { label: "垂直位置（0=最上，50=置中，100=最下）", name: "y", widget: "number", value_type: "int", default: 50, min: 0, max: 100, required: false }
          - { label: "縮放（100=鋪滿框框，數字越大越放大）", name: "zoom", widget: "number", value_type: "int", default: 100, min: 100, max: 200, required: false }
      - { label: "Instagram 貼文網址", name: "instagramUrl", widget: "string", required: false, hint: "類型選 Instagram 貼文嵌入時填寫，網格上會自動顯示官方嵌入元件（可滑動/播放），不需要另外準備封面圖" }
      - { label: "Facebook 貼文/短影音網址", name: "facebookUrl", widget: "string", required: false, hint: "類型選 Facebook 貼文/短影音嵌入時填寫，同樣會自動顯示官方嵌入元件" }
      - label: "圖片上傳"
        name: "image"
        widget: "object"
        required: false
        hint: "類型選上傳圖片時填寫"
        fields:
          - { label: "圖片", name: "src", widget: "image", required: false }
          - { label: "水平位置（0=最左，50=置中，100=最右）", name: "x", widget: "number", value_type: "int", default: 50, min: 0, max: 100, required: false }
          - { label: "垂直位置（0=最上，50=置中，100=最下）", name: "y", widget: "number", value_type: "int", default: 50, min: 0, max: 100, required: false }
          - { label: "縮放（100=鋪滿框框，數字越大越放大）", name: "zoom", widget: "number", value_type: "int", default: 100, min: 100, max: 200, required: false }
      - { label: "影片/連結網址", name: "linkUrl", widget: "string", required: false }
      - { label: "PDF 檔案", name: "pdfFile", widget: "file", required: false }
      - { label: "目標（這個案子想達成什麼）", name: "goal", widget: "text", required: false }
      - { label: "我的角色", name: "role", widget: "string", required: false }
      - { label: "成效說明（如：互動率 +68%）", name: "result", widget: "string", required: false }
      - { label: "詳細案例說明", name: "description", widget: "markdown", required: false }
      - { label: "排序（數字越小越前面）", name: "order", widget: "number", default: 0 }
